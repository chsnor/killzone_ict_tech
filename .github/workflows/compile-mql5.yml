name: Compile MQL5 EA

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**/*.mq5'
      - '**/*.mqh'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile Time Session Range Master EA
        uses: fx31337/mql-compile-action@v1
        with:
          include: .
          path: Time_Session_Range_Master_EA.mq5
          verbose: true

      - name: Upload Compiled EX5 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Time_Session_Range_Master_EA-EX5
          path: Time_Session_Range_Master_EA.ex5
          retention-days: 7
